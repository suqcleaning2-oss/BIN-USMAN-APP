name: Upload IPA to App Store

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies & Build Web Assets
        run: |
          npm install
          npm run build
          npx cap add ios || true
          npx cap sync ios

      - name: Build Archive & IPA
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa && zip -r BinUsman.ipa Payload

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/ipa/BinUsman.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}name: Upload IPA to App Store

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build --emptyOutDir
          npx cap add ios || true
          npx cap sync ios

      - name: Ensure Podfile & Build Archive
        run: |
          cd ios/App
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          pod install
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa && zip -r BinUsman.ipa Payload

      - name: Upload to App Store Connect
        env:
          KEY_ID: 9F33Z6XYHY
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.private_keys
          cp AuthKey_9F33Z6XYHY.p8 ~/.private_keys/
          chmod 600 ~/.private_keys/AuthKey_9F33Z6XYHY.p8
          xcrun altool --upload-app -f ios/App/build/ipa/BinUsman.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"