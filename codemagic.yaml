workflows:
  ios-release:
    name: iOS App Store Auto Build
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Assets
        script: npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Automatic Signing & IPA Export
        script: |
          app-store-connect fetch-signing-files "binusman.application" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -config Release \
            -archivePath ios/App/build/App.xcarchive archive
          xcodebuild -exportArchive \
            -archivePath ios/App/build/App.xcarchive \
            -exportPath ios/App/build/ipa \
            -exportOptionsPlist ios/App/App/ExportOptions.plist || true
    artifacts:
      - ios/App/build/ipa/*.ipa
      - ios/App/build/*.xcarchive
