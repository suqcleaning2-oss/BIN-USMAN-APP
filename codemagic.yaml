workflows:
  ios-ipa:
    name: iOS Signed IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App.xcworkspace"
        BUNDLE_ID: "binusman.application"
        APP_STORE_CONNECT_KEY_ID: "9F33Z6XYHY"
        APP_STORE_CONNECT_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
      node: 22.6.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install NPM dependencies
        script: npm ci
      - name: Build Web App
        script: npm run build
      - name: Sync iOS
        script: |
          npx cap sync ios
          npx pod-install ios/App
      - name: Build iOS IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath $CM_BUILD_DIR/App.xcarchive archive
          xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $CM_BUILD_DIR
    artifacts:
      - $CM_BUILD_DIR/*.ipa
