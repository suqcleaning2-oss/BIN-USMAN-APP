workflows:
  ios-workflow:
    name: Upload IPA to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      vars:
        ASC_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
        ASC_KEY_ID: "9F33Z6XYHY"

    scripts:
      - name: Upload existing IPA to TestFlight
        script: |
          set -e
          python3 -m pip install --quiet codemagic-cli-tools
          app-store-connect publish \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key "$(cat AuthKey_9F33Z6XYHY.p8)" \
            --path "App (17).ipa"
