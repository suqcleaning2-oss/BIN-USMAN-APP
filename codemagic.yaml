workflows:
  ios-release:
    name: iOS App Store Direct Upload
    environment:
      xcode: latest
      node: latest
      groups:
        - app_store_connect
    scripts:
      - name: Fast Re-use Existing Build
        script: |
          mkdir -p ios/App/build/ipa
          curl -sL "$CODEMAGIC_ARTIFACT_URL" -o ios/App/build/ipa/BinUsman.ipa || true
      - name: Upload Binary to App Store Connect
        script: |
          app-store-connect publish \
            --path "ios/App/build/ipa/BinUsman.ipa"
    artifacts:
      - ios/App/build/ipa/*.ipa
