workflows:
  ios-release:
    name: iOS Release Build
    environment:
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.binusman.app
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Assets
        script: npm run build
      - name: Add and Sync iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS App (.ipa)
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -config Release \
            -archivePath ios/App/build/App.xcarchive archive
          xcodebuild -exportArchive \
            -archivePath ios/App/build/App.xcarchive \
            -exportPath ios/App/build/ipa \
            -exportOptionsPlist ios/App/App/ExportOptions.plist || true
    artifacts:
      - ios/App/build/ipa/*.ipa
      - ios/App/build/*.xcarchive
