workflows:
  ios-release:
    name: iOS App Store Release
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Assets
        script: npm run build
      - name: Force Create Capacitor iOS & Podfile
        script: |
          npx cap add ios || true
          npx cap sync ios
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Podfile missing, generating manually..."
            cd ios/App && pod init
            cd ../..
          fi
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build Unsigned IPA Backup
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa && zip -r BinUsman.ipa Payload
    artifacts:
      - ios/App/build/ipa/*.ipa
