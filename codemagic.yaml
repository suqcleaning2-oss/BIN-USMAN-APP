workflows:
  ios-ipa:
    name: Build signed iOS IPA
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      vars:
        BUILD_NUMBER: "904"
        XCODE_PROJECT: "BIN-USMAN-APP"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Build Web App
        script: npm run build
      - name: Sync iOS with Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: cd ios && pod install --repo-update
      - name: Configure iOS signing
        script: xcode-project use-profiles
      - name: Set Build Number
        script: cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build Archive and Export IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "COMPILER_INDEX_STORE_ENABLE=NO"
    artifacts:
      - build/ios/ipa/*.ipa
