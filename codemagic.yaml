workflows:
  ios-ipa:
    name: Build signed iOS IPA
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        BUILD_NUMBER: "905"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        XCODE_WORKSPACE: "ios/App.xcworkspace"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
        automatic: true
    scripts:
      - name: Install JS dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Configure automatic iOS signing
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "COMPILER_INDEX_STORE_ENABLE=NO"
    artifacts:
      - build/ios/ipa/*.ipa
