workflows:
  ios-release:
    name: iOS App Store Direct Upload
    integrations:
      app_store_connect: "BIN USMAN KEYS"
    environment:
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Assets
        script: npm run build
      - name: Force Create Capacitor iOS & Podfile
        script: |
          npx cap add ios || true
          npx cap sync ios
          if [ ! -f "ios/App/Podfile" ]; then
            cd ios/App && pod init && cd ../..
          fi
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build Signed Archive
        script: |
          xcode-project use-profiles
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -config Release \
            -archivePath ios/App/build/App.xcarchive archive
          xcodebuild -exportArchive \
            -archivePath ios/App/build/App.xcarchive \
            -exportPath ios/App/build/ipa \
            -exportOptionsPlist ios/App/App/ExportOptions.plist || true
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
    artifacts:
      - ios/App/build/ipa/*.ipa
