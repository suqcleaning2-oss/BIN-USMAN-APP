workflows:
  upload-ipa-only:
    name: Upload Existing IPA to TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 20
    environment:
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "9F33Z6XYHY"
    scripts:
      - name: Upload IPA to TestFlight
        script: |
          IPA_PATH=$(find . -maxdepth 2 -name "App.ipa" | head -n 1)
          KEY_PATH=$(find . -maxdepth 2 -name "*.p8" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "Error: App.ipa nahi mili repo me!"
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          echo "Uploading to TestFlight..."

          app-store-connect publish \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$(cat $KEY_PATH)" \
            --path "$IPA_PATH"
