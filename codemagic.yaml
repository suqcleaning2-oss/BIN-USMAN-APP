workflows:
  ios-ipa:
    name: iOS Signed IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        BUNDLE_ID: "binusman.application"
        EXPORT_METHOD: "app-store"
      node: 22.6.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npx cap sync ios
      - name: Copy GoogleService-Info.plist
        script: |
          cp ios/App/GoogleService-Info.plist ios/App/GoogleService-Info.plist
      - name: Build iOS IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath $CM_BUILD_DIR/App.xcarchive archive
          xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $CM_BUILD_DIR
    artifacts:
      - $CM_BUILD_DIR/*.ipa
    publishing:
      email:
        recipients:
          - your-email@gmail.com
