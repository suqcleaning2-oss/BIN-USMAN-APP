workflows:
  ios-release:
    name: iOS App Store Direct Upload
    integrations:
      app_store_connect: "BIN USMAN KEYS"
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Assets
        script: npm run build
      - name: Force Create Capacitor iOS & Podfile
        script: |
          npx cap add ios || true
          npx cap sync ios
          if [ ! -f "ios/App/Podfile" ]; then
            cd ios/App && pod init && cd ../..
          fi
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Auto Create Certificates and Profiles
        script: |
          app-store-connect fetch-signing-files "binusman.application" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build Signed Archive & Export IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist App/ExportOptions.plist || true
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
    artifacts:
      - ios/App/build/ipa/*.ipa
