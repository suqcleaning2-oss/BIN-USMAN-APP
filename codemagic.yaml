workflows:
  ios-workflow:
    name: iOS Release Build 801
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "9F33Z6XYHY"
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
      xcode: latest
      cocoapods: default
    scripts:
      - name: Find and Copy GoogleService-Info.plist
        script: |
          APP_DIR="ios/App"
          PLIST="$APP_DIR/GoogleService-Info.plist"
          SOURCE=$(find . -type f -iname "GoogleService-Info.plist" ! -path "./$PLIST" -print -quit)
          if [ -z "$SOURCE" ] && [ ! -f "$PLIST" ]; then
            echo "Error: GoogleService-Info.plist not found anywhere in repo"
            exit 1
          fi
          if [ -n "$SOURCE" ]; then
            echo "Found plist at: $SOURCE"
            cp "$SOURCE" "$PLIST"
          else
            echo "Using existing plist at: $PLIST"
          fi

      - name: Force Set Build Number 801
        script: |
          PLIST_FILE="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 801" "$PLIST_FILE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST_FILE"

      - name: Install Pods
        script: |
          cd ios/App && pod install

      - name: Build IPA
        script: |
          xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
          
      - name: Publish to TestFlight
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          app-store-connect publish --path "$IPA_PATH"
    artifacts:
      - build/ios/ipa/*.ipa
