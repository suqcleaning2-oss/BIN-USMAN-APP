workflows:
  ios-release:
    name: iOS Release Build
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: CocoaPods Install
        script: cd ios/App && pod install
      - name: Build iOS App (.ipa)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa -exportOptionsPlist App/ExportOptions.plist CODE_SIGNING_ALLOWED=NO || true
    artifacts:
      - ios/App/build/ipa/*.ipa
      - ios/App/build/*.xcarchive
