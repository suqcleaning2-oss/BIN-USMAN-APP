workflows:
  ios-workflow:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "9F33Z6XYHY"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Hardcode Unique Build Version
        script: |
          # Codemagic build ID use karke high unique build number banayein
          UNIQUE_BUILD=$((100 + BUILD_NUMBER))
          echo "Setting unique build number to: $UNIQUE_BUILD"

          # Flutter project ke liye pubspec.yaml bhi update karo
          if [ -f "pubspec.yaml" ]; then
            sed -i '' "s/version: .*/version: 1.0.0+${UNIQUE_BUILD}/g" pubspec.yaml
            echo "Updated pubspec.yaml"
          fi

          # Info.plist update karo
          PLIST_FILE=$(find . -maxdepth 3 -name "Info.plist" | head -n 1)
          if [ -f "$PLIST_FILE" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $UNIQUE_BUILD" "$PLIST_FILE" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $UNIQUE_BUILD" "$PLIST_FILE" 2>/dev/null || true

            # Version name bhi set kar do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST_FILE" 2>/dev/null || true
          fi

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -project "$PROJECT" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            xcode-project build-ipa --project "$PROJECT" --scheme "$SCHEME"
          fi

      - name: Upload to App Store via App Store Connect
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: IPA not found!"
            exit 1
          fi

          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "Publishing $IPA_PATH to TestFlight..."
            app-store-connect publish \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
              --path "$IPA_PATH"
          else
            echo "Error: APP_STORE_CONNECT_PRIVATE_KEY not set in Codemagic!"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
