workflows:
  ios-release-ipa:
    name: iOS Release IPA 801 with Firebase
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "9F33Z6XYHY"
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
      xcode: latest
      node: 18
    scripts:
      - name: Copy GoogleService-Info.plist
        script: |
          set -euo pipefail
          plist_target="ios/App/GoogleService-Info.plist"
          plist_source=$(find . -type f -name "GoogleService-Info.plist" \
            ! -path "./$plist_target" -print -quit)
          if [ -n "$plist_source" ]; then
            echo "Found: $plist_source"
            mkdir -p "$(dirname "$plist_target")"
            cp "$plist_source" "$plist_target"
          elif [ ! -f "$plist_target" ]; then
            echo "ERROR: GoogleService-Info.plist not found in repo"
            exit 1
          fi
          ls -la "$plist_target"

      - name: Set Build Number 801
        script: |
          set -euo pipefail
          cd ios/App
          agvtool new-version -all 801

      - name: Install JS Dependencies
        script: |
          set -euo pipefail
          npm install

      - name: Sync Capacitor iOS Project
        script: |
          set -euo pipefail
          npx cap sync ios

      - name: Set up code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Build Signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project ios/App/App.xcodeproj --export-method app-store

    artifacts:
      - build/ios/ipa/*.ipa
