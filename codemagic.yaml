workflows:
  ios-workflow:
    name: Build and upload signed IPA to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      vars:
        ASC_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
        ASC_KEY_ID: "9F33Z6XYHY"
        BUNDLE_ID: "binusman.application"
        BUILD_NUMBER: "906"

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm ci
          npm run build
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update

      - name: Set iOS build number
        script: |
          set -e
          cd ios/App
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Regenerate App Store signing profile
        script: |
          set -e
          keychain initialize
          APP_STORE_PRIVATE_KEY="@file:$(pwd)/AuthKey_9F33Z6XYHY.p8"
          BUNDLE_ID_RESOURCE_ID=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key "$APP_STORE_PRIVATE_KEY" \
            --json | python3 -c 'import json, sys; data=json.load(sys.stdin); items=data.get("data", data) if isinstance(data, dict) else data; print(items[0]["id"])')
          CAPABILITIES=$(app-store-connect bundle-ids capabilities "$BUNDLE_ID_RESOURCE_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key "$APP_STORE_PRIVATE_KEY" \
            --json)
          if ! printf '%s' "$CAPABILITIES" | grep -q 'APPLE_ID_AUTH'; then
            app-store-connect bundle-ids enable-capabilities "$BUNDLE_ID_RESOURCE_ID" \
              --capability "Sign In with Apple" \
              --issuer-id "$ASC_ISSUER_ID" \
              --key-id "$ASC_KEY_ID" \
              --private-key "$APP_STORE_PRIVATE_KEY"
          fi
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace ios/App.xcworkspace \
            --scheme App \
            --config Release \
            --export-options-plist ios/ExportOptions.plist

      - name: Upload generated IPA to TestFlight
        script: |
          set -e
          app-store-connect publish \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key "$(cat AuthKey_9F33Z6XYHY.p8)" \
            --path "$(find build -type f -name '*.ipa' -print -quit)"
