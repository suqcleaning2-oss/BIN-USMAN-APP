workflows:
  ios-release:
    name: iOS Release Build
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install && npm install @capacitor/ios
      - name: Build web assets
        script: npm run build
      - name: Add and Sync iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Pod Install
        script: |
          cd ios/App && pod install
      - name: Build iOS App
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO || true
    artifacts:
      - ios/App/build/*.xcarchive
      - ios/App/build/ipa/*.ipa
