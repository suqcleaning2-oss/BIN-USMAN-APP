workflows:
  ios-release:
    name: iOS App Store Direct Upload
    environment:
      xcode: latest
      node: latest
      groups:
        - app_store_connect
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Assets
        script: npm run build
      - name: Force Create Capacitor iOS & Podfile
        script: |
          npx cap add ios || true
          npx cap sync ios
          if [ ! -f "ios/App/Podfile" ]; then
            cd ios/App && pod init && cd ../..
          fi
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build Signed Archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa && zip -r BinUsman.ipa Payload
      - name: Clean Key File & Upload
        script: |
          mkdir -p ~/.appstoreconnect/private_keys

          python3 -c "
import os
key = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '').strip()
key_id = os.environ.get('APP_STORE_CONNECT_KEY_IDENTIFIER', '').strip()
if '\\n' in key and not '\n' in key:
    key = key.replace('\\n', '\n')
file_path = f'/Users/builder/.appstoreconnect/private_keys/AuthKey_{key_id}.p8'
with open(file_path, 'w') as f:
    f.write(key + '\n')
"

          xcrun altool --upload-app \
            -f "ios/App/build/ipa/BinUsman.ipa" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - suqcleaning2@gmail.com
