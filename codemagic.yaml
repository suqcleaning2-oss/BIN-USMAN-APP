workflows:
  ios-workflow:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      xcode: latest
      cocoapods: default
    scripts:
      - name: Hardcode Unique Build Version
        script: |
          # Codemagic build ID use karke high unique build number banayein
          UNIQUE_BUILD=$((100 + BUILD_NUMBER))
          echo "Setting unique build number to: $UNIQUE_BUILD"

          PLIST_FILE=$(find . -maxdepth 3 -name "Info.plist" | head -n 1)
          if [ -f "$PLIST_FILE" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $UNIQUE_BUILD" "$PLIST_FILE" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $UNIQUE_BUILD" "$PLIST_FILE" 2>/dev/null || true
          fi
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -project "$PROJECT" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            xcode-project build-ipa --project "$PROJECT" --scheme "$SCHEME"
          fi
      - name: Upload to App Store via Fastlane
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            app-store-connect publish --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" "$IPA_PATH" || true
          else
            echo "Signing and IPA generation completed successfully!"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
