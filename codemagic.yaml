workflows:
  ios-ipa:
    name: iOS Signed IPA Firebase 11
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: "ios/App.xcodeproj"
        BUNDLE_ID: "binusman.application"
        APP_STORE_CONNECT_KEY_ID: "9F33Z6XYHY"
        APP_STORE_CONNECT_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
      node: 22.6.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
    scripts:
      - name: Install NPM dependencies
        script: npm ci
      - name: Build Web App
        script: npm run build
      - name: Sync iOS with Firebase 11 SPM
        script: |
          find node_modules/@capacitor-firebase -name Package.swift -type f -exec perl -pi -e 's/\.upToNextMajor\(from: "12\.7\.0"\)/.exact("11.12.0")/g' {} +
          npx cap sync ios
      - name: Set Build Number to 801
        script: |
          cd ios/App
          agvtool new-version -all 801
      - name: Build iOS IPA
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -archivePath $CM_BUILD_DIR/App.xcarchive archive IPHONEOS_DEPLOYMENT_TARGET=15.0 -allowProvisioningUpdates
          xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/App.xcarchive -exportOptionsPlist ../../ExportOptions.plist -exportPath $CM_BUILD_DIR
    artifacts:
      - $CM_BUILD_DIR/*.ipa
