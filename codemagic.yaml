workflows:
  ios-workflow:
    name: iOS Release Build 801 With Firebase
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "9F33Z6XYHY"
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
      xcode: latest
    scripts:
      - name: Add GoogleService-Info.plist
        script: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICE_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist

      - name: Set Build Number 801
        script: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 801" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.2" "ios/App/App/Info.plist"

      - name: Build IPA with Fastlane
        script: |
          set -euo pipefail
          cd ios
          fastlane gym \
          --project App/App.xcodeproj \
          --scheme App \
          --export_method app-store \
          --output_directory ../build/ios/ipa \
          --output_name App.ipa \
          --clean

      - name: Upload to TestFlight
        script: |
          set -euo pipefail
          fastlane pilot upload \
          --ipa build/ios/ipa/App.ipa \
          --skip_waiting_for_build_processing
    artifacts:
      - build/ios/ipa/*.ipa
