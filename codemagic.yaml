workflows:
  ios-workflow:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize Codemagic CLI Tools
        script: |
          pip3 install codemagic-cli-tools
      - name: Fetch Signing Files & Set Profiles
        script: |
          app-store-connect fetch-signing-files "binusman.application" --type IOS_APP_STORE --create
          xcode-project use-profiles
      - name: Build IPA
        script: |
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -project "$PROJECT" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            xcode-project build-ipa --project "$PROJECT" --scheme "$SCHEME"
          fi
      - name: Upload to App Store Connect
        script: |
          app-store-connect publish
