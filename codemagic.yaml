workflows:
  ios-workflow:
    name: iOS BINUSMAN Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      vars:
        XCODE_WORKSPACE: "ios/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "binusman.application"
        BUILD_NUMBER: "905"
      node: 22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci

      - name: Build Web App
        script: |
          npm run build

      - name: Sync iOS with Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Configure iOS signing after Capacitor sync
        script: |
          xcode-project use-profiles

      - name: Set Build Number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build Archive and Export IPA
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" archive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            -allowProvisioningUpdates
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR" \
            -exportOptionsPlist ios/ExportOptions.plist
    artifacts:
      - $CM_BUILD_DIR/*.ipa
      - /tmp/xcodebuild_logs/*.log
