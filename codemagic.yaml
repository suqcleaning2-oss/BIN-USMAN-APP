workflows:
  ios-app-store-upload:
    name: iOS App Store Direct Upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BinUsmanAuth
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: binusman.application
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies & Build Web
        script: |
          npm install --legacy-peer-deps
          npm run build || npx vite build --emptyOutDir
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build and Package Signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
