workflows:
  ios-release:
    name: iOS App Store Direct Upload
    environment:
      xcode: latest
      node: latest
      groups:
        - app_store_connect
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Assets
        script: npm run build
      - name: Force Create Capacitor iOS & Podfile
        script: |
          npx cap add ios || true
          npx cap sync ios
          if [ ! -f "ios/App/Podfile" ]; then
            cd ios/App && pod init && cd ../..
          fi
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build Signed Archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa && zip -r BinUsman.ipa Payload
      - name: Upload to App Store
        script: ./upload.sh
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - suqcleaning2@gmail.com
