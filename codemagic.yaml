workflows:
  ios-ipa:
    name: iOS Signed IPA with Firebase
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App.xcworkspace"
        BUNDLE_ID: "binusman.application"
        APP_STORE_CONNECT_KEY_ID: "9F33Z6XYHY"
        APP_STORE_CONNECT_ISSUER_ID: "18e19531-f1a6-4489-93ec-016e4260b4fd"
      node: 22.6.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
    scripts:
      - name: Install NPM dependencies
        script: npm ci
      - name: Build Web App
        script: npm run build
      - name: Sync iOS with Firebase 12
        script: |
          npx cap sync ios
          cd ios/App
          rm -rf Pods Podfile.lock
          pod repo update
          echo "platform :ios, '15.0'" > Podfile
          echo "use_frameworks!" >> Podfile
          echo "target 'App' do" >> Podfile
          echo "  pod 'Firebase', '12.7.0'" >> Podfile
          echo "  pod 'FirebaseFirestore', '12.7.0'" >> Podfile
          echo "  pod 'FirebaseAuth', '12.7.0'" >> Podfile
          echo "  pod 'FirebaseCrashlytics', '12.7.0'" >> Podfile
          echo "end" >> Podfile
          pod install --no-repo-update
      - name: Set Build Number to 801
        script: |
          cd ios/App
          agvtool new-version -all 801
      - name: Build iOS IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath $CM_BUILD_DIR/App.xcarchive archive IPHONEOS_DEPLOYMENT_TARGET=15.0 -skipPackagePluginValidation
          xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/App.xcarchive -exportOptionsPlist ../../ExportOptions.plist -exportPath $CM_BUILD_DIR
    artifacts:
      - $CM_BUILD_DIR/*.ipa
